# Task runner config — https://taskfile.dev
# Install: go install github.com/go-task/task/v3/cmd/task@latest
# List tasks: task --list
version: "3"

tasks:
  run:
    desc: Run the Anki TUI
    cmds:
      - go run ./cmd/anki {{.CLI_ARGS}}

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  install:
    desc: Build anki.exe and refresh the Desktop launcher shortcut
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 {{.CLI_ARGS}}

  uninstall:
    desc: Remove the Desktop shortcut and the built binary
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File uninstall.ps1 {{.CLI_ARGS}}

  lint:
    desc: Vet and check formatting
    cmds:
      - golangci-lint run ./...
      - go vet ./...

  fmt:
    desc: Format all Go files
    cmds:
      - golangci-lint run ./... --fix

  test:
    desc: Run all tests
    cmds:
      - go test ./... {{.CLI_ARGS}}

  check:
    desc: Build, lint and test
    deps: [build, lint, test]
